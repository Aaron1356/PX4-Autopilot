module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_OF1_CTRL:
      description:
        short: Optical flow upward (OFU) sensor aiding
      type: boolean
      default: 0
      min: 0
      max: 3
    EKF2_OF1_DELAY:
      description:
        short: Optical flow upward estimator delay relative to IMU measurements
      type: float
      default: 10
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_OF1_NOISE:
      description:
        short: Measurement noise for aux global position measurements
        long:  Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 1.0
      min: 0.01
      unit: m/s
      decimal: 2
    EKF2_OF1_GATE:
      description:
        short: Gate size for aux global position fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 3.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_OF1_ROLL:
      description:
        short: Set Roll angle of optical flow
        long: Set the Roll angle of the optical Flow sensor to be used in the Optical Flow Upward object
      type: float
      default: 0.0
      min: 0.0
      units: degrees
      decimal: 1
    EKF2_OF1_PITCH:
      description:
        short: Set Pitch angle of optical flow
        long: Set the Pitch angle of the optical Flow sensor to be used in the Optical Flow Upward object
      type: float
      default: 0.0
      min: 0.0
      units: degrees
      decimal: 1
    EKF2_OF1_YAW:
      description:
        short: Set Yaw angle of optical flow
        long: Set the Yaw angle of the optical Flow sensor to be used in the Optical Flow Upward object
      type: float
      default: 0.0
      min: 0.0
      units: degrees
      decimal: 1
    EKF2_OF1_POS_X:
      description:
          short: Position Offset X
          long: Set the X offset of the optical Flow sensor to be used in the Optical Flow Upward object
      type: float
      default: 0.0
      min: -1000.0
      units: meters
      decimal: 5
    EKF2_OF1_POS_Y:
      description:
          short: Position Offset Y
          long: Set the Y offset of the optical Flow sensor to be used in the Optical Flow Upward object
      type: float
      default: 0.0
      min: -1000.0
      units: meters
      decimal: 5
    EKF2_OF1_POS_Z:
      description:
        short: Position Offset Z
        long: Set the Z offset of the optical Flow sensor to be used in the Optical Flow Upward object
      type: float
      default: 0.0
      min: -1000.0
      units: meters
      decimal: 5
    EKF2_OF1_MODE:
      description:
        short: Direction the Optical Flow Sensor is facing
        long: |
          Sets the Optical Flow Sensor's Direction for orthogonal Directions for non orthogonal Directions use custom.
      type: enum
      values:
        0: Forward
        1: Sideway
        2: Upward
        4: Custom

    EKF2_OF1_VAR_P:
      description:
        short: Propotianlity value for variance
        long: |
          Propotianlity value for variance
      type: float
      default: 100.0
      decimals: 2
