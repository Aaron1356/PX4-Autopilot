module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_OFS_CTRL:
      description:
        short: Optical flow upward (OFS) sensor aiding
      type: boolean
      default: 0
      min: 0
      max: 3
    EKF2_OFS_DELAY:
      description:
        short: Optical flow sideways estimator delay relative to IMU measurements
      type: float
      default: 10
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_OFS_NOISE:
      description:
        short: Measurement noise for aux global position measurements
        long:  Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 1.0
      min: 0.01
      unit: m/s
      decimal: 2
    EKF2_OFS_GATE:
      description:
        short: Gate size for aux global position fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 3.0
      min: 1.0
      unit: SD
      decimal: 1
